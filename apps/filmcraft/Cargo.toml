[package]
name = "filmcraft"
description = "FilmCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "filmcraft"
build = "build.rs"

[lints]
workspace = true

[features]
default = ["llm", "voice-isolation"]
# Local AI explanations of grade nodes (fork G2.11): inference on the CPU and the opt-in model
# download (Settings ▸ Color ▸ AI explanations). Weights are never bundled.
llm = ["filmcraft-engine/llm", "filmcraft-engine/llm-download"]
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]
# Natural Text to Speech voices (Kokoro-82M on the CPU, downloaded on first use).
neural-voices = ["filmcraft-engine/neural-voices"]
# Voice isolation (fork AUDIO-PLAN A2): DeepFilterNet3 on the CPU, downloaded on request.
voice-isolation = ["filmcraft-engine/voice-isolation"]

[dependencies]
filmcraft-engine = { workspace = true, features = ["fork-resolve-default", "fork-inbox", "fork-update", "remote-net"] } # FORK-ONLY (RS1, AI5 inbox, UPD); remote-net: S2
filmcraft-export = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-remote = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-platform = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = { version = "0.18", features = ["pulseaudio"] }
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
# `wayland-data-control`: the Wayland clipboard directly where the compositor offers it (KDE Plasma,
# wlroots); elsewhere (GNOME) arboard falls back to X11 through XWayland as before (L1.6).
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Discord links in the system browser (MIT; as PhotoCraft).
open = "5"

[dev-dependencies]
glob = "0.3"
# the A1 audio soak drives the app headless (audio_soak.rs, #[ignore])
egui_kittest = { workspace = true, features = ["eframe"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"
# the window's Wayland surface for the global menu (global_menu.rs; same as eframe's)
raw-window-handle = "0.6"
# Title bar and borders drawn by the app where the compositor draws none (GNOME's Mutter has no
# xdg-decoration; KWin and most others decorate the window themselves, #433). Same winit as
# eframe; sctk-adwaita is MIT. `notitle`: frame and buttons without title text, because the
# titled variant embeds its own font file (fonts come only from craft-fonts, AGENTS.md §1.9).
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-notitle"] }

# Icon + VERSIONINFO for filmcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
