# Flatpak manifest for Revolution (FilmCraft-based), ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.dawgon2.Revolution.yml
#   flatpak run io.github.dawgon2.Revolution
#
# For a local test build without the generator script, `cargo vendor --locked <dir>` works too:
# in a copy of this file, replace the `cargo-sources.json` source with a `dir` source of <dir>
# (`dest: vendor`) and a `file` source (`dest: cargo`, `dest-filename: config.toml`) holding the
# config `cargo vendor` prints, its `directory` changed to /run/build/filmcraft/vendor. Needs
# org.freedesktop.Sdk//25.08, org.freedesktop.Sdk.Extension.rust-stable//25.08 and
# org.flatpak.Builder (`flatpak run org.flatpak.Builder …`); about 7 minutes on an i5-13500T.
#
# The command-line tool and its MCP server run in the same sandbox, without opening a window:
#
#   flatpak run --command=revolution-cli io.github.dawgon2.Revolution --version
#   flatpak run --command=revolution-cli io.github.dawgon2.Revolution mcp
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
id: io.github.dawgon2.Revolution
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: revolution
finish-args:
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # Audio playback and the mixer's meters (cpal over ALSA, which the runtime routes to the
  # host's PulseAudio or PipeWire server).
  - --socket=pulseaudio
  # GPU access for the wgpu compositor, scopes and effects (Vulkan, or GL as a fallback).
  - --device=dri
  # A project refers to its media by absolute path (docs/project-files.md), and the document
  # portal only exposes the file it was handed, not the media beside it: a project opened from
  # ~/Videos found none of its clips (#107). So, as other video editors do, FilmCraft reads and
  # writes the home directory (media, projects, exports, autosave next to the project) and the
  # usual mount points of external drives, where footage often lives. Open/Save dialogs still go
  # through the file-chooser portal; nothing outside these locations is granted.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # Desktop integration (LINUX-PLAN L1.7 / L2.3). File dialogs, the colour scheme and idle /
  # suspend inhibit go through portals (no grant needed); the single-instance name is under our
  # own app id (allowed by default). Media keys and the media widget (MPRIS):
  - --own-name=org.mpris.MediaPlayer2.filmcraft
  - --own-name=org.mpris.MediaPlayer2.filmcraft.*
  # "Export finished" notifications with their "Show in Folder" action, and the file manager
  # selecting the exported file:
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  # Send a file to a paired phone, and files shared from it (LINUX-PLAN L2.10): the KDE Connect
  # daemon on the session bus. Without KDE Connect installed the name is simply absent.
  - --talk-name=org.kde.kdeconnect
  # Eject a camera card after its verified copy (LINUX-PLAN L2.4): UDisks2 on the system bus.
  - --system-talk-name=org.freedesktop.UDisks2
  # Network (fork, FORK-PLAN §1a.107): Revolution checks GitHub for updates, downloads the
  # assistant's models on request and can share an answer as a GitHub issue, so unlike upstream
  # it is granted. The optional --control server still listens on 127.0.0.1 only. Host-wide
  # filesystem access is deliberately not granted.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: filmcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/filmcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p filmcraft -p filmcraft-cli
      - install -Dm755 target/release/filmcraft /app/bin/revolution
      # The headless CLI and its stdio MCP server, as in the release bundle (#346).
      - install -Dm755 target/release/filmcraft-cli /app/bin/revolution-cli
      - install -Dm644 packaging/linux/io.github.dawgon2.Revolution.desktop /app/share/applications/io.github.dawgon2.Revolution.desktop
      - install -Dm644 packaging/linux/io.github.dawgon2.Revolution.mime.xml /app/share/mime/packages/io.github.dawgon2.Revolution.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.dawgon2.Revolution.metainfo.xml.in > /app/share/metainfo/io.github.dawgon2.Revolution.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
