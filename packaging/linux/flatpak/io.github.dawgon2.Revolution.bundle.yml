# Flatpak manifest for the single-file bundle attached to every GitHub release
# (revolution-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux FHS tarball (revolution-<version>-linux-<arch>-fhs.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon, ALSA and Vulkan at runtime; the freedesktop runtime has all of them (its
# ALSA routes through PulseAudio/PipeWire), and the GPU driver comes from its
# org.freedesktop.Platform.GL extension.
#
# io.github.dawgon2.Revolution.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: io.github.dawgon2.Revolution
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: revolution
finish-args:
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # Audio playback and the mixer's meters (cpal over ALSA, which the runtime routes to the
  # host's PulseAudio or PipeWire server).
  - --socket=pulseaudio
  # GPU access for the wgpu compositor, scopes and effects (Vulkan, or GL as a fallback).
  - --device=dri
  # A project refers to its media by absolute path (docs/project-files.md), and the document
  # portal only exposes the file it was handed, not the media beside it: a project opened from
  # ~/Videos found none of its clips (#107). So, as other video editors do, FilmCraft reads and
  # writes the home directory (media, projects, exports, autosave next to the project) and the
  # usual mount points of external drives, where footage often lives. Open/Save dialogs still go
  # through the file-chooser portal; nothing outside these locations is granted.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # Desktop integration (LINUX-PLAN L1.7 / L2.3): MPRIS media keys, notifications with "Show in
  # Folder", the file manager selecting a file. Portals and our app-id names need no grant.
  - --own-name=org.mpris.MediaPlayer2.filmcraft
  - --own-name=org.mpris.MediaPlayer2.filmcraft.*
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  # Send a file to a paired phone, and files shared from it (LINUX-PLAN L2.10): the KDE Connect
  # daemon on the session bus. Without KDE Connect installed the name is simply absent.
  - --talk-name=org.kde.kdeconnect
  # Eject a camera card after its verified copy (LINUX-PLAN L2.4): UDisks2 on the system bus.
  - --system-talk-name=org.freedesktop.UDisks2
  # Network (fork, FORK-PLAN §1a.107): Revolution checks GitHub for updates, downloads the
  # assistant's models on request and can share an answer as a GitHub issue, so unlike upstream
  # it is granted. The optional --control server still listens on 127.0.0.1 only. Host-wide
  # filesystem access is deliberately not granted.
  - --share=network
modules:
  - name: filmcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/revolution /app/bin/revolution
      - install -Dm755 bin/revolution-cli /app/bin/revolution-cli
      - install -Dm644 share/applications/io.github.dawgon2.Revolution.desktop /app/share/applications/io.github.dawgon2.Revolution.desktop
      # The same MIME file the deb/rpm install (no types of its own yet; the runtime's
      # shared-mime-info already knows the video and audio formats).
      - install -Dm644 share/mime/packages/io.github.dawgon2.Revolution.xml /app/share/mime/packages/io.github.dawgon2.Revolution.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.dawgon2.Revolution.metainfo.xml /app/share/metainfo/io.github.dawgon2.Revolution.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/revolution /app/share/doc/
    sources:
      - type: dir
        path: stage
