must_not = []
style = "sloppy"

# --- vertical-reframe-follow ---

[[question]]
id = "pool-cr2-vert-tiktok"
kind = "creative"
family = "vertical-reframe-follow"
q = "turn my horizontal 6.2K clip into a TikTok and keep me in frame as I walk around"
sources = ["practice.delivery.vertical", "effects.stylize", "practice.youtube.safe-areas"]
must = ["duplicate the sequence (edit.duplicate), set it to 1080 × 1920 or 2160 × 3840 (sequence.settings) and reposition with Motion Position; open gate leaves room", "Auto Reframe (Video Effects ▸ Transform, Target Aspect Vertical 9:16) follows the subject; or keyframe Position by hand / track it", "keep text out of the bottom fifth and the right edge"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr2-vert-titles"
kind = "creative"
family = "vertical-reframe-follow"
q = "making a vertical cut of my youtube video, the lower thirds are off screen"
sources = ["practice.delivery.vertical", "graphics.responsive", "practice.youtube.safe-areas"]
must = ["titles placed for 16:9 fall outside the vertical frame: move or rebuild them in the vertical sequence", "keep key text near the centre, clear of the platform's buttons; guides in the Program monitor mark the zones"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr2-vert-pro"
kind = "creative"
family = "vertical-reframe-follow"
q = "9:16 deliverable from 3:2 open gate, auto-reframe or manual?"
sources = ["practice.delivery.vertical", "practice.youtube.punch-in", "effects.stylize"]
must = ["either: the Auto Reframe effect (Target Aspect Vertical 9:16, Motion Preset slower / faster) in a duplicated 9:16 sequence, or Motion Position per clip by hand for full control", "the 6240 × 4160 frame leaves room to reposition (and punch in) without losing resolution"]
must_not = []
style = "pro"

# --- music-duck-under-voice ---

[[question]]
id = "pool-cr2-duck-auto"
kind = "creative"
family = "music-duck-under-voice"
q = "make the music go quieter by itself whenever I talk, I don't want to draw keyframes"
sources = ["essential-sound.ducking", "essential-sound.types"]
must = ["tag the voice Dialogue and the song Music (essentialSound.setType)", "on the music clip turn Ducking on, duck against Dialogue, set sensitivity, reduce amount (−15 dB default) and fades, then Generate Keyframes (essentialSound.generateDucking)", "it writes ordinary Volume keyframes for you: none to draw, but regenerate after re-cutting"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr2-duck-pumping"
kind = "creative"
family = "music-duck-under-voice"
q = "auto ducking makes the music pump up and down between every word"
sources = ["essential-sound.ducking", "practice.audio.music-under-dialogue"]
must = ["pumping: slow the fades or lower the sensitivity and regenerate", "or ride the music fader yourself in Touch mode for music that should breathe"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr2-duck-ambience"
kind = "creative"
family = "music-duck-under-voice"
q = "duck the café ambience and the music under the interview, but not by the same amount"
sources = ["essential-sound.ducking", "essential-sound.types", "practice.audio.music-under-dialogue"]
must = ["Ducking is on both Music and Ambience types, each with its own amount (−15 dB music, −10 dB ambience by default)", "music roughly 15–20 dB under the voice while words play"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr2-duck-resolve"
kind = "creative"
family = "music-duck-under-voice"
q = "is there something like Fairlight sidechain ducking for music under VO"
sources = ["essential-sound.ducking", "mixing.automation"]
must = ["Essential Sound's Ducking on the music clip writes Volume keyframes against the dialogue (essentialSound.generateDucking)", "or record fader moves as automation during playback"]
must_not = []
style = "resolve-words"

# --- remove-passer-by (admitted gap: no object removal) ---

[[question]]
id = "pool-cr2-remove-walker"
kind = "creative"
family = "remove-passer-by"
q = "someone walked through the back of my tripod shot, can I get rid of them"
sources = ["practice.editing.clean-plate", "effects.opacity", "media.clips"]
must = ["no automatic object removal and fill: use a clean plate", "the take on V1, an empty moment on V2 (or a Frame Hold of it, clip.frameHold, if nothing else moves), shown through a feathered, tracked mask on V2's Opacity", "watch for light changes and shadows left behind"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr2-remove-sign"
kind = "creative"
family = "remove-passer-by"
q = "content-aware fill to remove a logo from a wall in a moving shot"
sources = ["practice.editing.clean-plate", "effects.opacity", "tracking.what"]
# G4.4: a mask that follows a wall is what the planar-tracked windows section tracks
alt_sources = { "tracking.what" = ["color.secondaries.planar"] }
must = ["Revolution has no content-aware fill / object removal yet", "workarounds: a patch of clean wall on a track above through a tracked mask, or blur / Mosaic the logo with a tracked mask", "a moving camera makes a clean plate hard to line up"]
must_not = []
style = "premiere-words"

[[question]]
id = "pool-cr2-remove-comp"
kind = "creative"
family = "remove-passer-by"
q = "do the clean plate removal as a comp instead of tracks"
sources = ["practice.editing.clean-plate", "compositor.basics", "compositor.masks"]
must = ["Media In for the take and the empty take, a Mask node on the empty take around the object, Merge it over the take", "feather the mask shape; the object removal itself is still a clean plate, nothing fills in automatically"]
must_not = []
style = "pro"

