# AI-POOL batch creative-2 (CREATIVE-POOL, FORK-PLAN §1a.91, AI-PLAN AI4 item 5c): held-out creative
# questions in goal families (`family`; a family is all held out or all training). Nine families:
# two extend creative-1's (ghost-figure, day-to-night-street) with variants; seven are new (double
# exposure, blurring a moving face, colour pop, vertical reframe, music ducking, removing a passer-by,
# a label that follows something). Every `must` is a plan sub-goal from the guide's own text; gap
# families say the gap with the guide's workaround (listed in creative-gaps.md). Admitted-gap
# families here: ghost-figure, remove-passer-by (2 of 9). Held-out only.

# --- ghost-figure (variants of creative-1's pool-cr1-ghost) ---

[[question]]
id = "pool-cr2-ghost-handheld"
kind = "creative"
family = "ghost-figure"
q = "I filmed handheld, can I still turn the person walking through into a see-through ghost?"
sources = ["practice.editing.clean-plate", "effects.opacity", "tracking.what"]
must = ["the clean-plate route needs a locked-off camera: with a handheld shot the empty take no longer lines up (only with tracking and luck)", "the ghost itself: the masked person on a track above, lower Opacity and a Screen blend mode, mask tracked with masks.track", "Revolution can't remove the person and fill in behind them automatically"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr2-ghost-pro"
kind = "creative"
family = "ghost-figure"
q = "Ghost comp: talent on a locked-off plate, I want them semi-transparent with a soft glow over an empty background plate. Node-wise how would you build it?"
sources = ["compositor.basics", "compositor.masks", "practice.editing.clean-plate", "effects.opacity"]
must = ["a comp: Media In for the empty plate as background, Media In of the take through a Mask node around the talent, Merge with low opacity and a Screen / Add blend", "a Blur node on the masked talent softens it", "the plate must be from the same locked-off camera and light"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr2-ghost-premiere"
kind = "creative"
family = "ghost-figure"
q = "in premiere I'd duplicate the layer, mask the person and drop opacity for a ghost. same thing here?"
sources = ["effects.opacity", "practice.editing.clean-plate"]
must = ["yes: the clip on a track above with a mask on Opacity (masks.add), feathered, tracked if they move (masks.track)", "Opacity down (around 20–40 %) and Blend Mode Screen or Linear Dodge (Add) so only the bright parts show", "to make the real person vanish underneath, the base track needs a clean plate; there's no automatic removal"]
must_not = []
style = "premiere-words"

# --- day-to-night-street (variants of creative-1's pool-cr1-day-to-night) ---

[[question]]
id = "pool-cr2-night-resolve"
kind = "creative"
family = "day-to-night-street"
q = "day for night on a sunny exterior, what nodes would you stack? I'm used to resolve"
sources = ["practice.grading.day-for-night", "color.secondaries.windows", "color.primaries.panel"]
must = ["a node with Gain / Gamma down, Temperature cool and Saturation low", "a gradient window to darken the sky most", "ellipse windows to keep practical lights and faces brighter; hard shadows and a bright sky give it away"]
must_not = []
style = "resolve-words"

[[question]]
id = "pool-cr2-night-sloppy"
kind = "creative"
family = "day-to-night-street"
q = "make my afternoon park clip look like its night time"
sources = ["practice.grading.day-for-night", "color.secondaries.windows"]
must = ["much darker, cooler and less saturated overall", "darken the sky with a gradient window; keep lights and eyes brighter with windows", "it works best when the sky isn't in shot and the sun was behind the subject"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr2-night-lumetri"
kind = "creative"
family = "day-to-night-street"
q = "can I do a day-to-night look just with Lumetri sliders?"
sources = ["color.lumetri.panel", "practice.grading.day-for-night", "color.lumetri.which"]
must = ["Lumetri Basic Correction: Exposure down, Temperature cooler, Saturation lower", "a Lumetri Vignette darkens the edges, but keeping single lights bright needs shapes: windows on a node in the node grader", "options with trade-offs: Lumetri is quick, the node grader gives windows and qualifiers"]
must_not = []
style = "premiere-words"

# --- double-exposure-portrait ---

[[question]]
id = "pool-cr2-dx-forest"
kind = "creative"
family = "double-exposure-portrait"
q = "how do I make a double exposure where a forest shows inside someone's face"
sources = ["practice.looks.double-exposure", "effects.opacity"]
must = ["face on V1, forest on V2; V2's Opacity Blend Mode Screen (or Lighten) at about 50–80 %", "a feathered mask on V2's Opacity keeps the forest inside the figure, tracked if the person moves", "grade both shots first; a calm texture works better than a busy one"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr2-dx-silhouette"
kind = "creative"
family = "double-exposure-portrait"
q = "silhouette against a white sky filled with city lights, which blend mode?"
sources = ["practice.looks.double-exposure", "effects.opacity"]
must = ["Multiply keeps the dark parts: a dark silhouette on a bright background gets filled with the texture", "Screen keeps the bright parts instead and needs a dark texture; Screen can never darken"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr2-dx-many-layers"
kind = "creative"
family = "double-exposure-portrait"
q = "I want three shots blended into one dreamy double exposure, not just two"
sources = ["practice.looks.double-exposure", "compositor.basics", "effects.opacity"]
must = ["more than two layers: a comp with Merge nodes, each with its own opacity and blend mode", "or stack clips on several tracks, each with its own Opacity blend mode"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr2-dx-resolve"
kind = "creative"
family = "double-exposure-portrait"
q = "in resolve I'd set the composite mode to screen for a double exposure, where is that here"
sources = ["effects.opacity", "practice.looks.double-exposure"]
must = ["the clip's Opacity effect has the Blend Mode (Resolve's Composite Mode), set with effects.setParam, effect opacity, param blend", "Screen for the classic look; 27 modes, the same list as Premiere's"]
must_not = []
style = "resolve-words"

# --- blur-moving-face ---

[[question]]
id = "pool-cr2-blur-face"
kind = "creative"
family = "blur-moving-face"
q = "blur out a stranger's face who walks past in my vlog"
sources = ["tracking.follow", "tracking.what", "effects.opacity"]
must = ["Gaussian Blur (or Mosaic for pixelation) with a mask around the face", "track the mask with Mask Path's track buttons (masks.track) so the blur follows; tracking.blurRegion does the effect, mask and track in one go", "if the track is lost the blur stays, to place by hand"]
must_not = []
style = "beginner"

[[question]]
id = "pool-cr2-blur-plate"
kind = "creative"
family = "blur-moving-face"
q = "pixelate a number plate on a moving car"
sources = ["tracking.follow", "tracking.what"]
must = ["Mosaic with an ellipse or rectangle mask on the plate, the mask tracked (tracking.blurRegion with effect mosaic)", "flat areas have nothing to follow: the track stops and says lost track rather than guessing"]
must_not = []
style = "sloppy"

[[question]]
id = "pool-cr2-blur-crowd"
kind = "creative"
family = "blur-moving-face"
q = "several people in the background need their faces hidden, each moves differently"
sources = ["tracking.what", "tracking.follow", "effects.opacity"]
must = ["one mask per face, each tracked on its own (masks.track)", "a blur or Mosaic limited to the masks; check each track and fix lost frames by hand"]
must_not = []
style = "pro"

[[question]]
id = "pool-cr2-blur-premiere"
kind = "creative"
family = "blur-moving-face"
q = "premiere has the mask tracker on mosaic, does filmcraft do face blur tracking too"
sources = ["tracking.follow", "tracking.what"]
must = ["yes: a mask on Gaussian Blur or Mosaic with Mask Path's track buttons", "tracking.blurRegion for agents and scripts, each part its own undo step"]
must_not = []
style = "premiere-words"

# --- colour-pop-one-colour ---

[[question]]
id = "pool-cr2-pop-red"
kind = "creative"
