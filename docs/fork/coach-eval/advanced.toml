# ---------- compositing (C1 Compositor; §1a.75 widens the set beyond grading) ----------

[[question]]
id = "adv-comp-key-over-bg"
kind = "multi-step"
q = "how do I put a green screen shot over a background plate with nodes?"
sources = ["compositor.recipes", "compositor.basics", "compositor.make", "keying.ultra-key"]
must = ["a Media In for the foreground and a Media In (or Solid) for the background", "a Key node on the foreground", "a Merge node: foreground over background", "the Merge goes to Media Out"]
must_not = ["sends the user to the Fusion page's 3D tools", "invents a node Revolution doesn't have"]

[[question]]
id = "adv-comp-check-a-node"
kind = "tool"
q = "how can I see what my key looks like before it gets merged?"
sources = ["compositor.view"]
must = ["double-click the node or right-click ▸ View", "the Program monitor shows that node's output", "View doesn't change the finished comp"]
must_not = ["confuses View with Set as Output"]

[[question]]
id = "adv-comp-layers-to-comp"
kind = "approach"
q = "I have a title and a logo stacked on three tracks, can I turn that into one composite clip?"
sources = ["compositor.convert"]
must = ["Convert to Comp Clip", "the comp looks the same as the stacked clips", "one clip on the timeline afterwards"]
must_not = ["calls it Nest without saying it's a comp"]

[[question]]
id = "adv-comp-media-in-source"
kind = "tweak"
q = "how do I change which clip a Media In node reads, and make the comp longer?"
sources = ["compositor.settings"]
must = ["comp.setSource with item or track", "comp.setSize with duration", "no button for these yet: commands only"]
must_not = ["invents a composition settings dialog"]

[[question]]
id = "adv-comp-slow"
kind = "pro-practice"
q = "my comp clip plays back slowly, what makes comps heavy?"
sources = ["compositor.speed"]
must = ["what the comp redraws every frame", "what makes it fall back to the processor"]
must_not = ["promises real-time for every comp"]

[[question]]
id = "adv-comp-whats-this"
kind = "tool"
q = "someone sent me a project with a comp, how do I understand what each node is doing?"
sources = ["compositor.explain", "compositor.basics"]
must = ["comp.explain describes it node by node in flow order", "nodes that do nothing are listed as unused"]
must_not = []

# ---------- editing, trimming, audio, delivery (§1a.75: AI3 learns all of editing) ----------

