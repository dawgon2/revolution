# Regression question set for "Ask the coach" (FORK-PLAN §1a.28 (a) / §1a.40 (b); COMPOSITOR-PLAN
# C1 item 6). Prepared 2026-10-12 ahead of C1; see DIAGNOSIS.md beside it.
#
# Same shape as assets/coach/questions.toml (`[[question]]` with `q`, `page`, `heading`), so the
# C1 test can load it with the same serde struct (extra fields are ignored unless the struct says
# `deny_unknown_fields`). Extra fields:
#
#   id          stable name for the test's failure messages
#   kind        order | what-for | how | why | where | resolve-word | premiere-word | typo | cut-off
#   origin      owner-verbatim | owner-paraphrase | agent
#   context     the page / tab the user is probably on when they ask (for §1a.28 (b): the
#               assistant should read it from the live UI state)
#   page/heading the guide section that answers (`heading` is the exact `##` text; a `###`
#               subsection is named by its parent `##`, because that is what the index returns)
#   alt         other sections that also answer: the test accepts any of them as the best section
#   status      covered  the section answers the question as written
#               partial  the guide has the fact but not where the coach looks for it (a trailing
#                        paragraph, a table, a "To write" stub) or only half of it; DIAGNOSIS.md
#                        lists the guide gap
#               uncovered the guide doesn't answer: the coach must say so (covered = false) and
#                        `should` names the page that ought to
#   needs_clip  true when a good answer depends on the clip or grade on screen (§1a.28 (b))
#   facts       what a correct answer must contain (the test can grep the answer's steps + summary
#               for the key words in brackets, or a reviewer reads them)
#   note        anything a reviewer or the retrieval fix should know
#
# Pass criterion for `covered` / `partial`: `covered == true` and the best section is `page` ›
# `heading` or one of `alt`. For `uncovered`: `covered == false`, no steps, no sources.
#
# Keep the owner's wording exactly (typos included) for origin = owner-verbatim.

